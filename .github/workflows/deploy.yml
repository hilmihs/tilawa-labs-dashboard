name: Deploy to VPS

# Push ke main → build image off-box (GHCR) → SSH ke VPS jalankan compose.
# Tombol manual: Actions → Deploy to VPS → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Namespace GHCR mengikuti pemilik repo yang menjalankan workflow ini,
      # bukan satu nama yang dipatok. GITHUB_TOKEN hanya boleh push ke namespace
      # pemiliknya sendiri, jadi nama yang dipatok berarti satu-satunya repo yang
      # bisa men-deploy adalah repo itu — dan cabang kedua yang menyalin berkas
      # ini harus mengubahnya kembali tiap kali, selamanya. GHCR menolak huruf
      # besar, sedangkan owner bisa punya (Tilawa Labs-Project-Dev), jadi dikecilkan.
      - name: Resolve image namespace
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/dashboard-administrasi-edu" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/$owner" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runner image = prod standalone → dipakai service `app`.
      - name: Build & push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:runner-main
            ${{ env.IMAGE }}:runner-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build image = punya drizzle-kit+tsx+source → dipakai one-shot `migrate`.
      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: true
          tags: |
            ${{ env.IMAGE }}:build-main
            ${{ env.IMAGE }}:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH ke VPS: refresh repo (compose + SQL migrasi), RENDER deploy/.env
      # penuh dari GitHub Secrets+Variables, pull image baru, up -d → migrate
      # one-shot (db:migrate + seed) → app. CI pegang SSH key, bukan kamu.
      #
      # Seluruh env di-generate di sini, jadi pindah/rebuild VPS = cukup install
      # docker + `git clone`; tak ada satu pun secret yang perlu diketik manual
      # di box. Sumber kebenaran env = Settings → Secrets/Variables di GitHub.
      #   • SECRET  (encrypted)  : password, token, cookie — sensitif.
      #   • VARIABLE (plaintext) : base URL, email, flag — non-sensitif.
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        env:
          # Namespace image yang baru saja diputuskan, diteruskan ke box supaya
          # compose menarik dari registry milik repo yang men-deploy.
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          # --- Secrets (sensitif) ---
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Opsional: override DATABASE_URL penuh (mis. DB managed eksternal).
          # Kosong = dibentuk otomatis dari POSTGRES_PASSWORD → rotate DB cukup
          # ganti satu secret, tak mungkin drift dengan Postgres di compose.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          TILAWAH_LOGIN_PASSWORD: ${{ secrets.TILAWAH_LOGIN_PASSWORD }}
          BERKAH_LOGIN_PASSWORD: ${{ secrets.BERKAH_LOGIN_PASSWORD }}
          BERKAH_SESSION_COOKIE: ${{ secrets.BERKAH_SESSION_COOKIE }}
          BERKAH_XSRF_TOKEN: ${{ secrets.BERKAH_XSRF_TOKEN }}
          MABNI_LOGIN_PASSWORD: ${{ secrets.MABNI_LOGIN_PASSWORD }}
          KIRIMI_USER_CODE: ${{ secrets.KIRIMI_USER_CODE }}
          KIRIMI_SECRET: ${{ secrets.KIRIMI_SECRET }}
          KIRIMI_DEVICE_ID: ${{ secrets.KIRIMI_DEVICE_ID }}
          # --- Variables (non-sensitif) ---
          TILAWAH_BASE_URL: ${{ vars.TILAWAH_BASE_URL }}
          TILAWAH_LOGIN_EMAIL: ${{ vars.TILAWAH_LOGIN_EMAIL }}
          BERKAH_BASE_URL: ${{ vars.BERKAH_BASE_URL }}
          BERKAH_LOGIN_EMAIL: ${{ vars.BERKAH_LOGIN_EMAIL }}
          MABNI_BASE_URL: ${{ vars.MABNI_BASE_URL }}
          MABNI_LOGIN_EMAIL: ${{ vars.MABNI_LOGIN_EMAIL }}
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          WARNING_LETTER_PREFIX: ${{ vars.WARNING_LETTER_PREFIX }}
          SP_ALERT_WA_NUMBER: ${{ vars.SP_ALERT_WA_NUMBER }}
          ADMIN_SQL_ENABLED: ${{ vars.ADMIN_SQL_ENABLED }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: IMAGE_PREFIX,POSTGRES_PASSWORD,DATABASE_URL,AUTH_SECRET,CRON_SECRET,OPS_SECRET,AGENT_TOKEN,TILAWAH_BASE_URL,TILAWAH_LOGIN_EMAIL,TILAWAH_LOGIN_PASSWORD,BERKAH_BASE_URL,BERKAH_LOGIN_EMAIL,BERKAH_LOGIN_PASSWORD,BERKAH_SESSION_COOKIE,BERKAH_XSRF_TOKEN,MABNI_BASE_URL,MABNI_LOGIN_EMAIL,MABNI_LOGIN_PASSWORD,STORAGE_BACKEND,WARNING_LETTER_PREFIX,KIRIMI_USER_CODE,KIRIMI_SECRET,KIRIMI_DEVICE_ID,SP_ALERT_WA_NUMBER,ADMIN_SQL_ENABLED,APP_BASE_URL
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main

            # --- Perbarui deploy/.env dari env yang diteruskan CI ---
            # MERGE, bukan timpa. Versi sebelumnya menulis ulang file penuh, jadi
            # setiap secret yang belum di-set di GitHub akan menghapus nilai yang
            # sudah berfungsi di box — dan karena baru 9 dari 24 kunci terisi,
            # deploy otomatis mati total di penjaga POSTGRES_PASSWORD (17 Agu 2026,
            # run 32038339008). Penjaga itu benar, yang salah adalah menuntut
            # SEMUA env pindah ke GitHub sekaligus sebelum satu deploy pun jalan.
            #
            # Aturannya sekarang:
            #   • nilai dari GitHub yang TIDAK kosong  → menang, menimpa .env
            #   • nilai kosong                          → baris lama dipertahankan
            #   • default hanya dipakai kalau kuncinya belum ada sama sekali
            # Jadi memindahkan env ke GitHub bisa satu per satu, kapan pun, dan
            # box yang benar-benar baru tetap wajib punya dua kunci kritikal.
            mkdir -p deploy
            if [ ! -f deploy/.env ]; then
              : "${POSTGRES_PASSWORD:?deploy/.env belum ada dan POSTGRES_PASSWORD secret kosong — batal}"
              : "${AUTH_SECRET:?deploy/.env belum ada dan AUTH_SECRET secret kosong — batal}"
              : > deploy/.env
              chmod 600 deploy/.env
            fi

            new="$(mktemp)"
            # put KEY NILAI [DEFAULT] — printf per-baris supaya nilai tak
            # diinterpretasi shell (aman untuk karakter khusus di password).
            put() {
              if [ -n "$2" ]; then
                printf '%s=%s\n' "$1" "$2" >> "$new"
              elif [ -n "${3-}" ] && ! grep -q "^$1=" deploy/.env; then
                printf '%s=%s\n' "$1" "$3" >> "$new"
              fi
            }

            # DATABASE_URL: override penuh kalau ada, else dibentuk dari password
            # DB — tapi hanya kalau password itu memang dikirim, supaya baris
            # DATABASE_URL yang sudah benar di box tidak diganti nilai setengah jadi.
            DB_URL="$DATABASE_URL"
            if [ -z "$DB_URL" ] && [ -n "$POSTGRES_PASSWORD" ]; then
              DB_URL="postgresql://mabni:${POSTGRES_PASSWORD}@db:5432/mabni"
            fi

            put POSTGRES_PASSWORD      "$POSTGRES_PASSWORD"
            put DATABASE_URL           "$DB_URL"
            put AUTH_SECRET            "$AUTH_SECRET"
            put CRON_SECRET            "$CRON_SECRET"
            put OPS_SECRET             "$OPS_SECRET"
            put AGENT_TOKEN            "$AGENT_TOKEN"
            put TILAWAH_BASE_URL       "$TILAWAH_BASE_URL"       "https://tilawah.example.org"
            put TILAWAH_LOGIN_EMAIL    "$TILAWAH_LOGIN_EMAIL"
            put TILAWAH_LOGIN_PASSWORD "$TILAWAH_LOGIN_PASSWORD"
            put BERKAH_BASE_URL        "$BERKAH_BASE_URL"        "https://cms.example.com"
            put BERKAH_LOGIN_EMAIL     "$BERKAH_LOGIN_EMAIL"
            put BERKAH_LOGIN_PASSWORD  "$BERKAH_LOGIN_PASSWORD"
            put BERKAH_SESSION_COOKIE  "$BERKAH_SESSION_COOKIE"
            put BERKAH_XSRF_TOKEN      "$BERKAH_XSRF_TOKEN"
            put MABNI_BASE_URL         "$MABNI_BASE_URL"         "https://mabni.example.org/api/v1"
            put MABNI_LOGIN_EMAIL      "$MABNI_LOGIN_EMAIL"
            put MABNI_LOGIN_PASSWORD   "$MABNI_LOGIN_PASSWORD"
            put STORAGE_BACKEND        "$STORAGE_BACKEND"        "local"
            put WARNING_LETTER_PREFIX  "$WARNING_LETTER_PREFIX"  "EKT/MPN-MBN"
            put KIRIMI_USER_CODE       "$KIRIMI_USER_CODE"
            put KIRIMI_SECRET          "$KIRIMI_SECRET"
            put KIRIMI_DEVICE_ID       "$KIRIMI_DEVICE_ID"
            put SP_ALERT_WA_NUMBER     "$SP_ALERT_WA_NUMBER"
            put ADMIN_SQL_ENABLED      "$ADMIN_SQL_ENABLED"      "false"
            put APP_BASE_URL           "$APP_BASE_URL"           "https://dashboard.example.org"

            # Baris lama yang tidak digantikan tetap hidup; tulis ke tmp lalu mv
            # atomik supaya tak ada jendela .env setengah jadi.
            out="$(mktemp)"
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"
              grep -q "^${key}=" "$new" || printf '%s\n' "$line" >> "$out"
            done < deploy/.env
            cat "$new" >> "$out"
            rm -f "$new"
            chmod 600 "$out"
            mv "$out" deploy/.env
            echo "deploy/.env: $(wc -l < deploy/.env) kunci"

            # Diekspor, bukan ditulis ke deploy/.env: compose membaca .env dari
            # direktori kerja (repo root), bukan dari sebelah berkas compose-nya,
            # jadi menaruhnya di sana tidak akan terbaca saat interpolasi image.
            export IMAGE_PREFIX
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            docker image prune -f

      # Gerbang kesehatan: beri waktu cold-start app, lalu poll ~2.5 menit.
      # URL dari repo variable HEALTH_URL (Settings → Variables) — set ke domain
      # VPS ini. Fallback ke domain lama agar non-breaking saat belum di-set.
      - name: Health check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://dashboard.example.org' }}
        run: |
          sleep 15
          for i in $(seq 1 20); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "attempt $i: HTTP $code ($HEALTH_URL)"
            [ "$code" = "200" ] && exit 0
            sleep 8
          done
          echo "health check failed"; exit 1
